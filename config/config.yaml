paths:
  metrics_csv: data/per_scene_evaluation_metrics.csv
  output_root: results
  figures_dir: results/figures
  data_root: data
  masks_dir: data/masks
  reference_masks_dir: data/masks/reference
  # Sample directories for error maps visualization.
  reference_samples_dir: data/samples/reference
  cloudscoreplus_samples_dir: data/samples/cloudscoreplus
  hybrid_samples_dir: data/samples/hybrid
  s2cloudless_samples_dir: data/samples/s2cloudless

algorithms:
  - cloudscoreplus
  - s2cloudless
  - hybrid

metrics:
  - f1_score
  - iou
  - mcc

samples:
  - 202104
  - 202009
  - 202506

algorithm_pairs:
  - [hybrid, s2cloudless]
  - [hybrid, cloudscoreplus]
  - [s2cloudless, cloudscoreplus]

statistics:
  alpha: 0.05
  random_seed: 42

bootstrap:
  tile_size: 256    # tile size in pixels
  b_scene: 1000     # per-scene tile bootstrap replicates
  b_global: 2000    # global paired bootstrap replicates

validation:
  required_columns:
    - scene_id
    - algorithm
  metric_columns:
    - precision
    - recall
    - f1_score
    - iou
    - mcc
    - cloud_fraction

# Thresholds and parameters for cloud masking algorithms. 
# These can be adjusted to optimize performance.
thresholds:
  cloud_filter: 90
  hybrid: 60
  s2cloudless:
    cloud_probability: 40
    nir_darkness: 0.15
    cloud_projection_distance: 1
    buffer: 50
  cloudscoreplus: 0.64